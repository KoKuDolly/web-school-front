<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <style>

        display: inline-block;
        width: 6px;
        height: 6px;

      }

  <body>
    <div id="container"></div>
    <button onclick="localStorage.setItem('map', JSON.stringify(map))">
      save
    </button>
    <button onclick="localStorage.removeItem('map')">clear</button>
    <script>
      // bfs 基础上，增加 启发式搜索
      // 每找一步，找距离终点最小的点，继续往下走
      class Sorted {
        constructor(data, compare) {
          this.data = data.slice()
          this.compare = compare || ((a, b) => a - b)
        }
        take() {
          if (!this.data.length) return
          let min = this.data[0]
          let minIndex = 0
          for (let i = 1; i < this.data.length; i++) {
            if (this.compare(this.data[i], min) < 0) {
              min = this.data[i]
              minIndex = i
            }
          }

          this.data[minIndex] = this.data[this.data.length - 1]
          this.data.pop()
          return min
        }
        give(v) {
          this.data.push(v)
        }
      }
    </script>
    <script>
      const map = localStorage.getItem('map')
        ? JSON.parse(localStorage.getItem('map'))
        : Array(10000).fill(0)

      const container = document.getElementById('container')
      for (let x = 0; x < 100; x++) {
        for (let y = 0; y < 100; y++) {
          const cell = document.createElement('div')
          cell.classList.add('cell')

          if (map[100 * x + y] === 1) {
            cell.style.backgroundColor = 'black'
          }
          cell.addEventListener('mousemove', () => {
            if (mousedown) {
              if (clear) {
                cell.style.backgroundColor = ''
                map[100 * x + y] = 0
              } else {
                cell.style.backgroundColor = 'black'
                map[100 * x + y] = 1
              }
            }
          })

          container.appendChild(cell)
        }
      }

      let mousedown = false
      let clear = false

      document.addEventListener('mousedown', (e) => {
        mousedown = true
        clear = e.which === 3
      })

      document.addEventListener('mouseup', () => (mousedown = false))
      document.addEventListener('contextmenu', (e) => e.preventDefault())
      // bfs 广度优先搜索 寻路
      async function findPath(map, start, end) {
        let table = Object.create(map)
        let queue = [start]
        async function insert(x, y, pre) {
          if (x < 0 || x > 100 || y < 0 || y > 100) return
          if (table[x * 100 + y]) return

          //   await sleep(1)
          if (container.children[x * 100 + y])
            container.children[x * 100 + y].style.backgroundColor = 'lightgreen'

          // map[x * 100 + y] = 2
          table[x * 100 + y] = pre

          queue.push([x, y])
        }

        while (queue.length) {
          let [x, y] = queue.shift()
          // console.log(x, y)
          if (x === end[0] && y === end[1]) {
            let path = []
            while (x !== start[0] || y !== start[1]) {
              path.push(map[x * 100 + y])
              ;[x, y] = table[x * 100 + y]
              await sleep(30)
              container.children[x * 100 + y].style.backgroundColor = 'purple'
            }
            return path
          }
          await insert(x - 1, y, [x, y])
          await insert(x, y - 1, [x, y])
          await insert(x + 1, y, [x, y])
          await insert(x, y + 1, [x, y])

          await insert(x - 1, y - 1, [x, y])
          await insert(x - 1, y + 1, [x, y])
          await insert(x + 1, y + 1, [x, y])
          await insert(x + 1, y - 1, [x, y])
        }
      }

      function sleep(t) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve()
          }, t)
        })
      }
    </script>

    <script>
      function bfsAndDfs() {
        let graph = {
          A: ['B', 'C'],
          B: ['A', 'C', 'D'],
          C: ['A', 'D', 'E'],
          D: ['B', 'C', 'E'],
          E: ['C', 'D', 'F'],
          F: ['E'],
        }

        function bfs(graph, startPoint) {
          let queue = []
          let result = []

          queue.push(startPoint)
          result.push(startPoint)

          while (queue.length > 0) {
            let point = queue.shift()
            let nodes = graph[point]
            for (let node of nodes) {
              if (result.includes(node)) continue
              result.push(node)
              queue.push(node)
            }
          }
          return result
        }

        function dfs(graph, startPoint) {
          let stack = []
          let result = []

          stack.push(startPoint)
          result.push(startPoint)

          while (stack.length > 0) {
            let point = stack.pop()
            let nodes = graph[point]
            for (let node of nodes) {
              if (result.includes(node)) continue
              result.push(node)
              stack.push(node)
            }
          }
          return result
        }

        let resultBfs = bfs(graph, 'A')
        let resultDfs = dfs(graph, 'A')
        // console.log(resultBfs, resultDfs)
      }

      bfsAndDfs()
    </script>
