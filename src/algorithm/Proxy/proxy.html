<body>
	<input type="range" max="255" min="0" id="r" />
	<input type="range" max="255" min="0" id="g" />
	<input type="range" max="255" min="0" id="b" />

	<div id="color" style="width: 100px; height: 100px"></div>
</body>
<script src="./proxy.js"></script>
<script>
	console.log(po)
	const obj = {
		r: 0,
		g: 0,
		b: 0,
	}
	po = reactive(obj)
	effect(() => {
		document.getElementById('r').value = po.r
	})
	effect(() => {
		document.getElementById('g').value = po.g
	})
	effect(() => {
		document.getElementById('b').value = po.b
	})

	document
		.getElementById('r')
		.addEventListener('input', (event) => (po.r = event.target.value))
	document
		.getElementById('g')
		.addEventListener('input', (event) => (po.g = event.target.value))
	document
		.getElementById('b')
		.addEventListener('input', (event) => (po.b = event.target.value))

	effect(() => {
		document.getElementById(
			'color'
		).style.backgroundColor = `rgb(${po.r}, ${po.g}, ${po.b})`
	})
</script>
