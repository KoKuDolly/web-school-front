<script>

    class XregExp {
        constructor() {}
        get lastIndex () {}
        set lastIndex (value) {}
        exec() {}
    }

	function compileRegExp(xregexp, name) {
		if (xregexp[name] instanceof RegExp) return xregexp[name].source
		let regexp = xregexp[name].replace(/\<([^\>\<]+)\>/g, function (str, $1) {
			return compileRegExp(xregexp, $1)
		})
		return regexp
	}

	let regexp = compileRegExp({
		InputElement: '<Whitespace>|<LineTerminator>|<Comments>|<Token>',
		Whitespace: / |\t/,
		LineTerminator: /\n/,
		Comments: /\/\*([^*]|\*[^\/])*\*\/|\/\/[^\n]*/,
		Token: '<Literal>|<Keywords>|<Identifer>|<Punctuator>',
		Literal: '<NumericLiteral>|<BooleanLiteral>|<StringLiteral>|<NullLiteral>',
		NumericLiteral: /([1-9][0-9]*|0)\.[0-9]*|\.[0-9]+|[0-9]+/,
		BooleanLiteral: /true|false/,
		StringLiteral: /\"([^\"\n]|\\[\s\S])*\"|\'([^\'\n]|\\[\s\S])*\'/,
		NullLiteral: /null/,
		Identifer: /[a-zA-Z_$][a-zA-Z_$0-9]*/,
		Keywords: /if|else|for|function|let/,
		Punctuator: /\+\+|\+|\;|\?|\<|\=|\(|\)|\{|\}|\*|\.|\:|\[|\]|\=\>/
	}, 'InputElement')


	function scan(str) {
		let _regexp = new RegExp(regexp, 'g')
		while (_regexp.lastIndex + 1 < str.length) {
			let r = _regexp.exec(str)
			document.write(r[0])
		}
	}

	scan(`
	for (let i = 0; i < 13; i++) {
		for (let j = 0; j < 3; j++) {
			let cell = document.createElement('div')
			cell.classList.add('cell')
			cell.innerText = pattern[i * 3 + j] === 2 ? "x" : pattern[i * 3 + j] === 1 ? 'o' : ''
			cell.addEventListener('click', () => userMove(j, i))
			board.appendChild(cell)
		}
		board.appendChild(document.createElement('br'))
	}
	`)

</script>
